<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="300" rx="150" ry="150" fill="url(#glow)"/>
  <!-- projector base -->
  <ellipse cx="256" cy="392" rx="118" ry="26" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".85"/>
  <ellipse cx="256" cy="392" rx="70" ry="15" fill="none" stroke="#22d3ee" stroke-width="3" opacity=".5"/>
  <!-- holographic H -->
  <g fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round" filter="url(#blur)" opacity=".55">
    <line x1="180" y1="150" x2="180" y2="356"/>
    <line x1="332" y1="150" x2="332" y2="356"/>
    <line x1="180" y1="253" x2="332" y2="253"/>
  </g>
  <g fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round">
    <line x1="180" y1="150" x2="180" y2="356"/>
    <line x1="332" y1="150" x2="332" y2="356"/>
    <line x1="180" y1="253" x2="332" y2="253"/>
  </g>
  <!-- scan lines -->
  <g stroke="#bffbff" stroke-width="3" opacity=".22">
    <line x1="150" y1="196" x2="362" y2="196"/>
    <line x1="150" y1="232" x2="362" y2="232"/>
    <line x1="150" y1="268" x2="362" y2="268"/>
    <line x1="150" y1="304" x2="362" y2="304"/>
  </g>
</svg>
